<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proyectos — Omni Vibe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0d12;
      --surface: #0f1318;
      --surface2: #151b22;
      --border: rgba(0,229,160,0.12);
      --border-hover: rgba(0,229,160,0.35);
      --accent: #00e5a0;
      --accent-dim: rgba(0,229,160,0.08);
      --text: #e8f0e8;
      --text-muted: #6b7a6b;
      --text-dim: #3d4d3d;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,13,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 2px;
    }
    .nav-logo span { color: var(--text-muted); font-weight: 400; }
    nav a.back {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    nav a.back:hover { color: var(--accent); border-color: var(--border-hover); }

    /* HERO */
    .hero {
      position: relative; z-index: 1;
      padding: 80px 2rem 60px;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
    }
    .hero-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: inline-block;
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 20px;
    }
    .hero h1 {
      font-family: var(--mono);
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 1rem;
    }
    .hero h1 .accent { color: var(--accent); }
    .hero p {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.7;
      font-weight: 300;
    }

    /* FILTROS */
    .filters {
      position: relative; z-index: 1;
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center;
      padding: 0 2rem 48px;
    }
    .filter-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--border-hover);
      color: var(--accent);
    }

    /* GRID */
    .projects-grid {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      background: var(--surface2);
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface2);
      position: relative;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-thumb img { transform: scale(1.04); }
    .card-thumb .thumb-placeholder {
      font-family: var(--mono);
      font-size: 36px;
      color: var(--text-dim);
    }
    .card-thumb .tag-type {
      position: absolute; top: 12px; left: 12px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--accent);
      background: rgba(10,13,18,0.85);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }
    .card-body { padding: 20px; }
    .card-title {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 300;
      margin-bottom: 16px;
    }
    .card-tags {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0,229,160,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .card-links {
      display: flex; gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .card-link {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      display: flex; align-items: center; gap: 5px;
      transition: color 0.2s;
    }
    .card-link:hover { color: var(--accent); }
    .card-link svg { width: 13px; height: 13px; }

    /* EMPTY STATE */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
    }
    .empty-icon { font-size: 48px; margin-bottom: 1rem; opacity: 0.3; }
    .empty p { font-family: var(--mono); color: var(--text-muted); font-size: 14px; }

    /* CTA BOTTOM */
    .cta-bottom {
      position: relative; z-index: 1;
      text-align: center;
      padding: 60px 2rem 80px;
      border-top: 1px solid var(--border);
    }
    .cta-bottom p {
      font-family: var(--mono);
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 1.5rem;
    }
    .cta-btn {
      display: inline-block;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #0a0d12;
      background: var(--accent);
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cta-btn:hover { opacity: 0.85; }

    /* ANIMATIONS */
    .card { opacity: 0; animation: fadeUp 0.4s ease forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .projects-grid { grid-template-columns: 1fr; padding: 0 1rem 80px; }
      .hero { padding: 60px 1rem 40px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="https://github.com/omni404vibe-commits/omni-vibe">OMNI<span>VIBE</span></a>
  <a class="back" href="https://github.com/omni404vibe-commits/omni-vibe">← README</a>
</nav>

<div class="hero">
  <span class="hero-tag">Portfolio</span>
  <h1>Lo que he<br/><span class="accent">construido</span></h1>
  <p>Proyectos reales para negocios reales — páginas, sistemas, automatizaciones y bots.</p>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">Todos</button>
  <button class="filter-btn" data-filter="landing">Landing Pages</button>
  <button class="filter-btn" data-filter="automatizacion">Automatizaciones</button>
  <button class="filter-btn" data-filter="sistema">Sistemas Web</button>
  <button class="filter-btn" data-filter="bot">Bots & Scrapers</button>
</div>

<div class="projects-grid" id="grid">
  <!-- Los proyectos se cargan desde projects.js -->
</div>

<div class="cta-bottom">
  <p>¿Quieres un proyecto como estos?</p>
  <a class="cta-btn" href="https://wa.me/18494314342">Hablemos por WhatsApp →</a>
</div>

<script src="projects.js"></script>
<script>
  // ── RENDER ──────────────────────────────────────────
  const grid = document.getElementById('grid');
  let activeFilter = 'all';

  function renderCards(filter) {
    const items = filter === 'all'
      ? PROJECTS
      : PROJECTS.filter(p => p.type === filter);

    grid.innerHTML = '';

    if (items.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <p>No hay proyectos en esta categoría aún.</p>
        </div>`;
      return;
    }

    items.forEach((p, i) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = p.demo || p.repo || '#';
      card.target = '_blank';
      card.rel = 'noopener';
      card.style.animationDelay = `${i * 0.07}s`;

      const thumb = p.image
        ? `<img src="${p.image}" alt="${p.title}" loading="lazy"/>`
        : `<div class="thumb-placeholder">${p.icon || '⚡'}</div>`;

      const tags = p.tags.map(t => `<span class="tag">${t}</span>`).join('');

      const links = [];
      if (p.demo) links.push(`
        <a class="card-link" href="${p.demo}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Demo en vivo
        </a>`);
      if (p.repo) links.push(`
        <a class="card-link" href="${p.repo}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
          Código
        </a>`);

      const typeLabel = {
        landing: 'Landing Page',
        automatizacion: 'Automatización',
        sistema: 'Sistema Web',
        bot: 'Bot / Scraper'
      }[p.type] || p.type;

      card.innerHTML = `
        <div class="card-thumb">
          ${thumb}
          <span class="tag-type">${typeLabel}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-tags">${tags}</div>
          ${links.length ? `<div class="card-links">${links.join('')}</div>` : ''}
        </div>`;

      grid.appendChild(card);
    });
  }

  // ── FILTROS ──────────────────────────────────────────
  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards(activeFilter);
  });

  renderCards('all');
</script>
</body>
</html>
